<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title> Application Form</title>
</head>
<body style="background-color: skyblue;">
<h1 style="text-align:center; color: black;">Application form</h1>
<form>
	<table border="1" cellpadding="5" width="400";align:center;>
		<tr>
			<td>User Name:</td>
			<td><input type="text" name="first name"></td>
		</tr>
		<tr>
			<td>Password:</td>
			<td><input type="Password" name="Password"></td>
		</tr>
		<tr>
		<td>Email:</td>
		 <td><input type="Email" name="Email"></td>
		</tr>
		<tr>
			<td>DOB:</td>
			<td><input type="date" name="DOB"></td>
		</tr>
		<tr>
			<td>Gender:</td>
			<td><input type="radio" name="Gender" value="Male">Male
<input type="radio" name="Gender" value="Female">Female</td>
		</tr>
		<tr>
			<td><h2>Skills</h2></td>
			<td><input type="checkbox" name="Skills" value="C">C<br>
<input type="checkbox" name="Skills" value="C++">C++<br>
<input type="checkbox" name="Skills" value="Java">Java<br>
<input type="checkbox" name="Skills" value="Python">Python</td>
		</tr>
		<tr>
			<td>Address:</td>
			<td><textarea></textarea></td>
		</tr>
		<tr>
			<td><h2>Country</h2></td>
			<td><select>
	<option value="India">India</option><br>
	<option value="USA">USA</option><br>
	<option value="Austrila">Austrila</option><br>
	<option value="Srilanka">Srilanka</option><br>
</select><br></td>
<tr>
	<td><h2>State</h2></td>
	<td><select>
	<option value="Hyderabad">Hyderabad</option><br>
	<option value="Delhi">Delhi</option><br>
	<option value="Mumbai">Mumbai</option><br>
	<option value="Kerala">Kerala</option><br>
	<option value="punjab">punjab</option><br>
</select><br></td>
</tr>
<tr>
	<td><h2>City</h2></td>
	<td><select>
	<option value="Siddipet">Siddipet</option><br>
	<option value="Medak">Medak</option><br>
	<option value="Rangareddy">Rangareddy</option><br>
	<option value="karimnagar">Karimnagar</option><br>
	<option value="Siddipet">Sangareddy</option><br>
</select><br></td>
</tr>
<tr>
	<td>Submit</td>
	<td><input type="SUBMIT" value="SUBMIT"><br></td>
</tr>
<tr>
	<td>Reset</td>
	<td><input type="RESET" value="RESET"></td>
</tr>
	</table>
</form>
</body>
</html>
